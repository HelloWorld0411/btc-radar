# ===========================================================================
# LLM 二次过滤(可选, 默认关闭)
# ---------------------------------------------------------------------------
# 开启后, 分数刚好卡在门槛附近的条目会交给 Claude 判断"是否真的值得打扰你",
# 能明显减少噪音。需要:
#   1. 把下面的 enabled 改成 true
#   2. 在 GitHub 仓库的 Secrets 里加一个 ANTHROPIC_API_KEY
#   3. 确认 model 名字在你的账号下可用(API 计费, 大约每天几分钱)
# 不开也完全能用, 只是关键词过滤会稍微粗一点。
# ===========================================================================
llm_filter:
  enabled: false
  model: "claude-3-5-haiku-latest"
  # 分数落在 [threshold - borderline_band, threshold + borderline_band] 区间内才调用
  borderline_band: 6
